<!DOCTYPE html>
<html>
<head>
    <title>Weekend Weather Direction</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        #map { height: 600px; }
        table { border-collapse: collapse; margin-bottom: 20px; }
        td, th { padding: 4px 8px; }
        .leaflet-tooltip {
        font-size: 11px;
        line-height: 1.3;
        padding: 4px 6px;
        }
    </style>
</head>
<body>
    <h1>Direction Recommendations</h1>

    <h2>Next 6 Hours — Best Option Each Hour</h2>
    <table border="1">
        <tr>
            <th>Time</th>
            <th>Best Direction</th>
            <th>Feels Like</th>
            <th>Reason</th>
        </tr>
        {% for row in outlook %}
        <tr>
            <td>{{ row[0] }}</td>
            <td>{{ row[1] }}</td>
            <td>{{ row[2] }}</td>
            <td>{{ row[3] }}</td>
        </tr>
        {% endfor %}
    </table>

    <div id="map"></div>

    <script>
        var mapData = {{ rows | tojson }};

        var map = L.map('map').setView([mapData[0][6], mapData[0][7]], 10);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        for (var i = 0; i < mapData.length; i++) {
            var row = mapData[i];
            var direction = row[1];
            var feelsLike = row[3];
            var rank = row[4];
            var lat = row[6];
            var lon = row[7];
            var reason = row[8];
            var feelsLikeSequence = row[9].join(", ");
            var label = "<b>" + direction + "</b><br>Feels like: " + feelsLike + "<br>Rank: " + rank + "<br>" + reason + "<br>Next 6h: " + feelsLikeSequence;

            L.marker([lat, lon]).addTo(map)
                .bindTooltip(label, { permanent: true, direction: "right", offset: [10, 0] })
                .openTooltip();
        }
    </script>
</body>
</html>
