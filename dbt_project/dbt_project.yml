name: 'comfort_compass'
version: '1.0.0'

# Must match the top-level key in profiles.yml -- exact, case-sensitive.
profile: 'comfort_compass'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

# No `models:` block -- every model here is a view, which is dbt's default
# materialization, so there's nothing to override at the project level.
