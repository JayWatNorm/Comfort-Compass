name: comfort-compass

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./ingestion/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  dbt:
    build: .
    command: ["dbt", "run", "--project-dir", "dbt_project"]
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DB_HOST: postgres
    restart: "no"

  cron:
    build: .
    # cron doesn't inherit the container's environment by default - this
    # writes it to /etc/environment first, which Debian's cron does read
    # automatically, before starting the cron daemon in the foreground.
    command: ["sh", "-c", "printenv | grep -v 'no_proxy' >> /etc/environment && cron -f"]
    depends_on:
      postgres:
        condition: service_healthy
      dbt:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      DB_HOST: postgres
    volumes:
      - ./.env:/app/.env:ro
    restart: unless-stopped

  flask:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      dbt:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      DB_HOST: postgres
    ports:
      - "5000:5000"
    restart: unless-stopped

volumes:
  pgdata:
