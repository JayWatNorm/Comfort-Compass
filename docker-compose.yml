services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./ingestion/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  dbt:
    build: .
    command: ["dbt", "run", "--project-dir", "dbt_project"]
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DB_HOST: postgres
    restart: "no"

  flask:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      dbt:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      DB_HOST: postgres
    ports:
      - "5000:5000"
    restart: unless-stopped

volumes:
  pgdata:
