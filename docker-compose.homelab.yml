# Homelab-only override, layered on top of docker-compose.yml via:
#   docker compose -f docker-compose.yml -f docker-compose.homelab.yml up -d --build
#
# Purpose: point dbt/cron/flask at the shared postgres-dev instance (on the
# homelab, same one used for local dev) instead of this repo's own bundled
# postgres service -- so prod data is queryable from pgAdmin the same way
# dev already is, with no SSH tunnel needed. docker-compose.yml itself is
# untouched -- a fresh clone anywhere else still gets the fully
# self-contained, bundled-postgres setup via that file alone.
#
# postgres-dev has a published host port (5434), reachable directly over
# the LAN by IP -- unlike postgres-prod, which has no exposed port at all.
# That's why this doesn't need any Docker network-joining: connecting to
# 192.168.1.203:5434 works the same way from these containers as it does
# from your own Windows machine.

services:
  # Tagging this with a profile that's never activated means a plain
  # `docker compose -f docker-compose.yml -f docker-compose.homelab.yml up`
  # simply never starts it -- no need to remember to list services manually.
  postgres:
    profiles: ["standalone-only"]

  dbt:
    # No longer waits on a local postgres healthcheck that will never run.
    depends_on: {}
    environment:
      DB_HOST: 192.168.1.203
      DB_PORT: "5434"

  cron:
    # Still waits on dbt finishing -- that ordering has nothing to do with
    # which database is being used.
    depends_on:
      dbt:
        condition: service_completed_successfully
    environment:
      DB_HOST: 192.168.1.203
      DB_PORT: "5434"

  flask:
    depends_on:
      dbt:
        condition: service_completed_successfully
    environment:
      DB_HOST: 192.168.1.203
      DB_PORT: "5434"
