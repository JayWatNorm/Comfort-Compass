# Homelab-only override, layered on top of docker-compose.yml via:
#   docker compose -f docker-compose.yml -f docker-compose.homelab.yml up -d --build
#
# Purpose: point dbt/cron/flask at the shared postgres-prod instance
# instead of this repo's own bundled postgres service. docker-compose.yml
# itself is untouched -- a fresh clone anywhere else still gets the fully
# self-contained, bundled-postgres setup via that file alone.
#
# postgres-prod now has a published host port (5435, added 2026-07-25),
# reachable directly over the LAN by IP -- same as postgres-dev's 5434.
# No Docker network-joining needed: connecting to 192.168.1.203:5435 works
# the same way from these containers as it does from your own Windows
# machine.
#
# Note: the local `postgres` service is deliberately NOT disabled here.
# An earlier attempt tried tagging it with a profile so it would never
# start, but Compose merges `depends_on` between files key-by-key rather
# than letting an override clear it -- dbt/cron/flask still depended on
# postgres in the merged config, which conflicted with postgres being
# profile-excluded and broke config validation entirely. Simpler to just
# let the bundled postgres container start as normal (its healthcheck
# passes fine, satisfying depends_on) and sit there unused -- dbt/cron/
# flask ignore it regardless, since DB_HOST/DB_PORT below point elsewhere.

services:
  dbt:
    environment:
      DB_HOST: 192.168.1.203
      DB_PORT: "5435"

  cron:
    environment:
      DB_HOST: 192.168.1.203
      DB_PORT: "5435"

  flask:
    environment:
      DB_HOST: 192.168.1.203
      DB_PORT: "5435"
